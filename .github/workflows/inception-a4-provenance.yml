name: Inception A4 public verification

on:
  push:
    branches: [agent/inception-a4-provenance-policy]
  pull_request:
    paths:
      - profiles/agent-thinking-inception/owners/compliance/**
      - profiles/agent-thinking-inception/policies/provenance/**
      - profiles/agent-thinking-inception/evidence/compliance/**
      - profiles/agent-thinking-inception/prompts/07-provenance-owner.system.md
      - .github/workflows/inception-a4-provenance.yml

permissions:
  contents: read

jobs:
  telemetry-leak-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A4 verification manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          print(f"subject commit={head} tree={tree}")

          manifest = json.loads((root / "profiles/agent-thinking-inception/owners/compliance/preflight.json").read_text())
          exact = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A4",
              "stage": "OWNER_PUBLIC_VERIFICATION",
              "state": "TELEMETRY_LEAK_CANARY_CANDIDATE",
              "repository": "ed3c/enterprise_agent_system",
              "branch": "agent/inception-a4-provenance-policy",
          }
          for key, value in exact.items():
              assert manifest.get(key) == value, f"DRIFT:{key}"
          base = manifest["base_subject"]
          assert base == {
              "commit": "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e",
              "tree": "c3851a6953d456d0342a9776eed28561c1af0ca1",
              "parent_pull_request": 29,
          }
          controller = manifest["controller_subject"]
          assert controller["commit"] == base["commit"] and controller["tree"] == base["tree"]
          assert controller["packet_digest"] == "sha256:b5c26bce1f39a9523b3b15585ac7a7d2a1618cbbc5a8e4cc980daea079e5e9de"
          assert set(manifest["dimensions"]) == {"code", "model", "data", "trace"}
          for key in (
              "state_machine", "implementation_subjects", "writable_paths", "read_only_paths",
              "resource_leases", "required_evidence_lanes", "positive_controls",
              "mutation_controls", "forbidden_actions", "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, key
          assert not set(manifest["writable_paths"]) & set(manifest["read_only_paths"])
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "BIND_EXACT_EXTERNAL_TERMS_AND_RUN_SCOPED_LIVE_TELEMETRY_CANARY"

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"], text=True
          ).splitlines()
          allowed_exact = {".github/workflows/inception-a4-provenance.yml"}
          allowed_prefixes = (
              "profiles/agent-thinking-inception/owners/compliance/",
              "profiles/agent-thinking-inception/policies/provenance/",
              "profiles/agent-thinking-inception/evidence/compliance/",
              "profiles/agent-thinking-inception/prompts/07-provenance-owner.system.md",
          )
          violations = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          assert not violations, f"PATH_LEASE_VIOLATION:{violations}"
          required = set(manifest["implementation_subjects"])
          assert required.issubset(set(changed)), "IMPLEMENTATION_SUBJECT_MISSING"
          print(f"PASS atom=INCEPTION-A4 changed={len(changed)} mutations={len(manifest['mutation_controls'])}")
          PY

      - name: Execute policy and telemetry disagreement controls
        run: |
          python3 profiles/agent-thinking-inception/owners/compliance/verify_policy.py

      - name: Execute sanitize-before-export synthetic leak canary
        run: |
          python3 profiles/agent-thinking-inception/owners/compliance/test_telemetry_canary.py -v

      - name: Compile and parse exact subjects
        run: |
          python3 -m py_compile \
            profiles/agent-thinking-inception/owners/compliance/verify_policy.py \
            profiles/agent-thinking-inception/owners/compliance/telemetry_canary.py \
            profiles/agent-thinking-inception/owners/compliance/test_telemetry_canary.py
          python3 -m json.tool profiles/agent-thinking-inception/policies/provenance/four-tier-policy-candidate.schema.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/policies/provenance/telemetry-flow.schema.json >/dev/null

      - name: Check committed patch hygiene
        run: git diff --check 6e0a916fd06dd8635d77c9a8c4d1b475185ea13e...HEAD
