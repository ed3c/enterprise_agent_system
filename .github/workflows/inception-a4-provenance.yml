name: Inception A4 provenance-policy preflight

on:
  push:
    branches:
      - agent/inception-a4-provenance-policy
  pull_request:
    paths:
      - profiles/agent-thinking-inception/owners/compliance/**
      - profiles/agent-thinking-inception/policies/provenance/**
      - profiles/agent-thinking-inception/evidence/compliance/**
      - profiles/agent-thinking-inception/prompts/07-provenance-owner.system.md
      - .github/workflows/inception-a4-provenance.yml

permissions:
  contents: read

jobs:
  deterministic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A4 preparation manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          manifest_path = root / "profiles/agent-thinking-inception/owners/compliance/preflight.json"
          readme_path = root / "profiles/agent-thinking-inception/owners/compliance/README.md"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          readme = readme_path.read_text(encoding="utf-8")

          expected = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A4",
              "stage": "OWNER_IMPLEMENTATION_PREPARATION",
              "state": "READY_FOR_FIRST_IMPLEMENTATION_COMMIT",
              "repository": "ed3c/enterprise_agent_system",
              "branch": "agent/inception-a4-provenance-policy",
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, f"DRIFT:{key}:{manifest.get(key)!r}"

          base = manifest["base_subject"]
          assert base == {
              "commit": "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e",
              "tree": "c3851a6953d456d0342a9776eed28561c1af0ca1",
              "parent_pull_request": 29,
          }, "BASE_SUBJECT_DRIFT"
          controller = manifest["controller_subject"]
          assert controller["commit"] == base["commit"]
          assert controller["tree"] == base["tree"]
          assert controller["packet_digest"] == "sha256:b5c26bce1f39a9523b3b15585ac7a7d2a1618cbbc5a8e4cc980daea079e5e9de"
          assert controller["bundle_digest"] == "sha256:dc4473b3195a738e55eb49c43661b6e1f4ea7f95c66749454776f2003b18ebc3"
          assert manifest["source_subject"] == {
              "id": "SRC-PDF-INCEPTION-001",
              "digest": "sha256:a6f1245ff865cae24838ed8ec4828330be684f3c03b29b9064ade8bfac94d8da",
              "class": "SOURCE_PROPOSAL",
              "egress": "LOCAL_ONLY",
          }
          assert set(manifest["dimensions"]) == {"code", "model", "data", "trace"}
          for dimension, fields in manifest["dimensions"].items():
              assert isinstance(fields, list) and fields, f"EMPTY_DIMENSION:{dimension}"
              assert len(fields) == len(set(fields)), f"DUPLICATE_DIMENSION_FIELD:{dimension}"

          for key in (
              "state_machine",
              "writable_paths",
              "read_only_paths",
              "resource_leases",
              "required_evidence_lanes",
              "positive_controls",
              "mutation_controls",
              "forbidden_actions",
              "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, f"EMPTY_OR_MISSING:{key}"
              assert len(values) == len(set(values)), f"DUPLICATE:{key}"

          assert not (set(manifest["writable_paths"]) & set(manifest["read_only_paths"])), "LEASE_OVERLAP"
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "ADD_STRICT_FOUR_TIER_POLICY_AND_TELEMETRY_FLOW_SCHEMAS_WITH_FIRST_HOLLOW_CONTROL"
          assert "OWNER IMPLEMENTATION PREPARATION ONLY" in readme
          assert "cannot self-promote `POLICY_ADMITTED`" in readme
          assert "do not by themselves prove zero leakage" in readme

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"],
              text=True,
          ).splitlines()
          allowed = {
              "profiles/agent-thinking-inception/owners/compliance/README.md",
              "profiles/agent-thinking-inception/owners/compliance/preflight.json",
              ".github/workflows/inception-a4-provenance.yml",
          }
          unexpected = sorted(set(changed) - allowed)
          assert not unexpected, f"PATH_LEASE_VIOLATION:{unexpected}"

          combined = readme + "\n" + json.dumps(manifest, ensure_ascii=False)
          for forbidden in ("/Users/", "/home/", "/mnt/data/", "gemini.google.com", "BEGIN PRIVATE KEY"):
              assert forbidden not in combined, f"PRIVATE_LOCATOR_OR_SECRET:{forbidden}"
          assert not re.search(r"(?i)(api[_-]?key|password|private[_-]?key)\s*[:=]\s*['\"][^'\"]+", combined)

          print(
              "PASS atom=INCEPTION-A4 state=READY_FOR_FIRST_IMPLEMENTATION_COMMIT "
              f"changed={len(changed)} mutations={len(manifest['mutation_controls'])}"
          )
          PY

      - name: Check textual patch hygiene
        run: git diff --check
