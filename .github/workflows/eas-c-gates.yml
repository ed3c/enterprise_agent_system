name: EAS-C control-plane gates

on:
  push:
    branches:
      - agent/eas-c-control-plane-contracts
  pull_request:
    paths:
      - ".github/workflows/eas-c-gates.yml"
      - "contracts/control-plane/**"
      - "docs/adr/0001-repository-role-and-owner-plane-boundaries.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bind exact subject
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Validate positive control-plane examples
        run: >-
          python3 contracts/control-plane/verify.py
          contracts/control-plane/examples/source-subject.example.json
          contracts/control-plane/examples/cross-repo-binding.example.json
          contracts/control-plane/examples/closure-record.example.json
          contracts/control-plane/examples/orchestration-run.example.json

      - name: Replay planted refusal controls
        run: >-
          python3 contracts/control-plane/verify.py
          --selftest contracts/control-plane/examples

      - name: Compile semantic gate
        run: python3 -m py_compile contracts/control-plane/verify.py
