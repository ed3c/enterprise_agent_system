name: EAS-D final exact documentation verification

on:
  pull_request:
    paths:
      - ".github/workflows/eas-d-final-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-root-d-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable root EAS-D target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 89e12f5863c9bfd02bddb28de121d9c19cc25d16
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact target multi-parent base and writer lease
        shell: bash
        run: |
          set -euo pipefail
          target="89e12f5863c9bfd02bddb28de121d9c19cc25d16"
          tree="16e51462b2a0a693c1af92ad344fa3db6bbd4879"
          base="aa10bc13f2cfd4d33f0ffdf67f3e4923cb352c2f"
          gx="3f8af3d75b28ca1904fe07b8ea9ee0d291f5989c"
          pd="690154a5f7154d551bef6942fe5d1f34091c2197"
          test "$(git rev-parse HEAD)" = "$target"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          git merge-base --is-ancestor "$base" HEAD
          parents="$(git show -s --format='%P' "$base")"
          test "$parents" = "$gx $pd" || test "$parents" = "$pd $gx"
          unexpected="$(git diff --name-only "$base"...HEAD | grep -Ev '^README\.md$|^AGENTS\.md$|^ARCHITECTURE\.md$|^CONTEXT\.md$|^docs/INDEX\.md$|^docs/architecture/|^docs/prompts/|^docs/traceability/|^prompts/README\.md$|^handoff/README\.md$' || true)"
          test -z "$unexpected" || { printf 'EAS_D_PATH_LEASE_VIOLATION:\n%s\n' "$unexpected"; exit 2; }
          test "$(git diff --name-only "$base"...HEAD | wc -l)" -eq 18
          git diff --quiet "$base"..HEAD -- \
            profiles/agent-thinking-inception \
            src/enterprise_agent_system \
            contracts/control-plane \
            plans \
            evidence \
            handoff/local-handoff-queue.json \
            .github
          printf 'PASS target=%s tree=%s base=%s changed=18\n' "$target" "$tree" "$base"

      - name: Execute inherited Generic-X and Profile-D semantic controls
        run: |
          python3 tests/test_convergence.py
          python3 profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence.py
          python3 profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence.py --selftest
          python3 profiles/agent-thinking-inception/tests/convergence/verify_ordered_controls.py
          python3 profiles/agent-thinking-inception/tests/docs/verify_profile_docs.py
          python3 profiles/agent-thinking-inception/tests/docs/verify_profile_docs.py --selftest

      - name: Verify root documentation closure projection and prompt completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          required_files = [
              "README.md", "AGENTS.md", "ARCHITECTURE.md", "CONTEXT.md",
              "docs/INDEX.md", "docs/architecture/STATE_MACHINES.md",
              "docs/architecture/DATA_FLOW.md", "docs/traceability/MOLECULAR_STACK_INDEX.md",
              "prompts/README.md", "handoff/README.md",
          ]
          for path in required_files:
              assert (root / path).is_file(), path

          corpus = "\n".join((root / path).read_text(encoding="utf-8") for path in required_files)
          literal = [
              "15/15", "1/15", "requirement closure credit", "14/14",
              "BLOCKED_FOR_CLOSURE", "PLAN_ONLY", "NOT_IMPLEMENTED", "ADVISORY_ONLY",
              "COMPLETE_AT_DOCS_CEILING", "READY_FOR_PREPARATION", "execution NOT_PERFORMED",
              "32268112684", "32270454491", "4973663047", "4973885537",
              "32267670154", "32270129840", "32271993913",
              "3f8af3d75b28ca1904fe07b8ea9ee0d291f5989c",
              "690154a5f7154d551bef6942fe5d1f34091c2197",
          ]
          for token in literal:
              assert token in corpus, token

          readme = (root / "README.md").read_text(encoding="utf-8")
          context = (root / "CONTEXT.md").read_text(encoding="utf-8")
          assert "P6 root documentation candidate                  COMPLETE_AT_DOCS_CEILING / PR #41" in readme
          assert "P6 root documentation candidate                  IN_PROGRESS" not in readme
          assert "P7 Local Handoff                                 READY_FOR_PREPARATION / execution NOT_PERFORMED" in readme
          assert "state          P6_ROOT_DOCUMENTATION_CANDIDATE_COMPLETE" in context
          assert "P7 execution   NOT_PERFORMED" in context
          assert "state          IN_PROGRESS" not in context
          assert "external receipts" in context

          prompt_dir = root / "docs/prompts"
          prompts = sorted(prompt_dir.glob("P*-*.system.md"))
          assert len(prompts) == 8, [p.name for p in prompts]
          expected = {f"P{i}" for i in range(8)}
          observed = {p.name.split("-")[0] for p in prompts}
          assert observed == expected, observed
          for prompt in prompts:
              text = prompt.read_text(encoding="utf-8")
              for marker in ("Objective", "Evidence ceiling", "Required receipt", "Stop conditions", "Handoff"):
                  assert marker in text, (prompt.name, marker)
              assert any(marker in text for marker in ("Writer lease", "Writable lease", "## Lease", "## Authority")), prompt.name
              assert "prior chat" in text.lower() or "chat memory" in text.lower() or "fresh-session" in text.lower(), prompt.name

          stack = (root / "docs/traceability/MOLECULAR_STACK_INDEX.md").read_text(encoding="utf-8")
          assert "EAS-A" in stack and "subject=null" in stack and "NOT_IMPLEMENTED" in stack
          assert "Profile-D is a true child of Profile-X" in stack
          assert "real multi-parent convergence base" in stack

          state = (root / "docs/architecture/STATE_MACHINES.md").read_text(encoding="utf-8")
          for marker in ("State Machine", "Canonical owner", "Gate", "Evidence ceiling", "next owner"):
              assert marker.lower() in state.lower(), marker

          flow = (root / "docs/architecture/DATA_FLOW.md").read_text(encoding="utf-8")
          for marker in ("Forbidden flows", "UNKNOWN_EFFECT", "Human admission", "PLAN_ONLY"):
              assert marker in flow, marker

          print("PASS root docs routes=10 prompts=8 requirements=15 contradictions=14 p6=COMPLETE_AT_DOCS_CEILING p7=READY_NOT_EXECUTED")
          PY

      - name: Compile parse and patch hygiene
        run: |
          python3 -m py_compile \
            src/enterprise_agent_system/convergence.py \
            profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence.py \
            profiles/agent-thinking-inception/tests/docs/verify_profile_docs.py
          python3 -m json.tool evidence/ledgers/cross-repo-closure.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/closure-record.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/vertical-canary.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/molecular-stack-index.json >/dev/null
          git diff --check aa10bc13f2cfd4d33f0ffdf67f3e4923cb352c2f...HEAD

      - name: Evidence ceiling receipt
        run: |
          cat <<'EOF'
          PASS EAS-DV exact root documentation verification
          target=89e12f5863c9bfd02bddb28de121d9c19cc25d16
          tree=16e51462b2a0a693c1af92ad344fa3db6bbd4879
          base=aa10bc13f2cfd4d33f0ffdf67f3e4923cb352c2f
          root_doc_paths=18
          fresh_session_prompts=8
          requirements=15
          contradictions=14
          required_lanes_satisfied=1
          requirement_closure_credit=0
          profile_shadow=BLOCKED_FOR_CLOSURE
          vertical_canary=PLAN_ONLY
          EAS_A=NOT_IMPLEMENTED
          P6=COMPLETE_AT_DOCS_CEILING
          P7=READY_FOR_PREPARATION_EXECUTION_NOT_PERFORMED
          Human_admission=NOT_PERFORMED
          release_rollback=NOT_PERFORMED
          EOF
