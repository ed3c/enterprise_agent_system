name: EAS-D v3 exact root documentation verification

on:
  push:
    branches: [verify/eas-d-v3-exact-6981c700]
  pull_request:
    paths:
      - .github/workflows/eas-d-v3-verification.yml

permissions:
  contents: read

jobs:
  verify-root-d-v3-target:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable Root-D v3 target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6981c700f9f2f9128ebeebdf80e627178b2be336
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact target parent and 18-path writer lease
        shell: bash
        run: |
          set -euo pipefail
          target="6981c700f9f2f9128ebeebdf80e627178b2be336"
          tree="d044ae652b65af6a0aba49f0f79c7c04c630bebf"
          parent="f04f9fc78270c8f97ce978e2ccc161ab4d724ca4"
          test "$(git rev-parse HEAD)" = "$target"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          test "$(git rev-parse HEAD^)" = "$parent"
          python3 - <<'PY'
          import subprocess
          parent = "f04f9fc78270c8f97ce978e2ccc161ab4d724ca4"
          expected = {
              "README.md", "AGENTS.md", "ARCHITECTURE.md", "CONTEXT.md",
              "docs/INDEX.md", "docs/architecture/DATA_FLOW.md",
              "docs/architecture/STATE_MACHINES.md",
              "docs/prompts/P0-source-authority-auditor.system.md",
              "docs/prompts/P1-contract-lock-worker.system.md",
              "docs/prompts/P2-tech-lead-controller.system.md",
              "docs/prompts/P3-owner-wave-worker.system.md",
              "docs/prompts/P4-shadow-architect.system.md",
              "docs/prompts/P5-convergence-owner.system.md",
              "docs/prompts/P6-docs-stack-convergence.system.md",
              "docs/prompts/P7-local-handoff-compiler.system.md",
              "docs/traceability/MOLECULAR_STACK_INDEX.md",
              "handoff/README.md", "prompts/README.md",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{parent}...HEAD"], text=True
          ).splitlines())
          assert changed == expected, f"ROOT_D_V3_PATH_LEASE:{sorted(changed ^ expected)}"
          print(f"PASS Root-D v3 direct parent and writer lease files={len(changed)}")
          PY

      - name: Replay current Profile-X v4 and Profile-D v5 controls
        run: |
          python3 profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence.py
          python3 profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence_mutations.py
          python3 profiles/agent-thinking-inception/tests/docs/verify_profile_docs.py
          python3 profiles/agent-thinking-inception/tests/docs/verify_profile_docs.py --selftest

      - name: Verify root current-subject projection and evidence ceilings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          required = [
              "README.md", "AGENTS.md", "ARCHITECTURE.md", "CONTEXT.md",
              "docs/INDEX.md", "docs/architecture/STATE_MACHINES.md",
              "docs/architecture/DATA_FLOW.md",
              "docs/traceability/MOLECULAR_STACK_INDEX.md",
              "prompts/README.md", "handoff/README.md",
          ]
          for path in required:
              assert (root / path).is_file(), path
          corpus = "\n".join((root / path).read_text(encoding="utf-8") for path in required)
          current_tokens = (
              "250717db1cad584d50890c0d851153fa2cd755e8",
              "fbf6a75b6e89e906f227110dc5a61e4355b8a891",
              "32295871632", "4976213414", "ADVISORY_ONLY",
              "b295eabec7b4c9d4e1f65f7fb0238034f454ae7f",
              "df4cd19d9acbedcbd0b00245b6339cc9ef7e99e0",
              "32321499909", "4978282030",
              "f04f9fc78270c8f97ce978e2ccc161ab4d724ca4",
              "32326260896", "4978669357",
              "PLAN_ONLY", "BLOCKED_FOR_CLOSURE", "NOT_ADMITTED",
              "NOT_PERFORMED", "NOT_PROVEN",
          )
          for token in current_tokens:
              assert token in corpus, f"ROOT_CURRENT_TOKEN_MISSING:{token}"

          context = (root / "CONTEXT.md").read_text(encoding="utf-8")
          assert "ROOT_D_V3_CANDIDATE" in context
          assert "P7 current     REBIND_REQUIRED" in context
          assert "P7 execution   NOT_PERFORMED" in context
          assert "COMPLETE_AT_DOCS_CEILING" not in context

          stack = (root / "docs/traceability/MOLECULAR_STACK_INDEX.md").read_text(encoding="utf-8")
          for token in (
              "Profile-X v3 #40   authority NONE",
              "Profile-D v4 #44   authority NONE",
              "Root-D v2 #57      authority NONE",
              "P7 #59              authority NONE",
              "H3R #67             authority NONE",
              "H3RR #71            authority NONE",
          ):
              assert token in stack, f"STALE_DENOMINATOR_MISSING:{token}"
          assert "EAS-A #68 feeds Generic/Profile convergence as `PROCESS_DEPENDENCY_NOT_GIT_PARENT`" in stack

          state = (root / "docs/architecture/STATE_MACHINES.md").read_text(encoding="utf-8")
          assert "Profile-D #23" in state and "Root-D v3" in state
          assert "post-EAS-A P7 rebind required" in state
          flow = (root / "docs/architecture/DATA_FLOW.md").read_text(encoding="utf-8")
          for marker in (
              "Forbidden flows", "EAS-A advisory view", "PLAN_ONLY canary",
              "stale P7 #59/#67/#71", "Human admission",
          ):
              assert marker in flow, marker

          readme = (root / "README.md").read_text(encoding="utf-8")
          assert "requirements                                     15" in readme
          assert "contradictions                                   14 preserved" in readme
          assert "stronger no-credit lanes                         13" in readme
          assert "required lanes satisfied                          1" in readme
          assert "requirement closure credit                        0" in readme
          assert "vertical canary                                  PLAN_ONLY / execution_receipt=null" in readme
          print("PASS root current subjects + evidence ceilings + stale denominator")
          PY

      - name: Verify all P0-P7 fresh-session prompts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          prompt_dir = Path("docs/prompts")
          prompts = sorted(prompt_dir.glob("P*-*.system.md"))
          assert len(prompts) == 8, [p.name for p in prompts]
          assert {p.name.split("-")[0] for p in prompts} == {f"P{i}" for i in range(8)}
          for prompt in prompts:
              text = prompt.read_text(encoding="utf-8")
              lower = text.lower()
              assert "fresh-session" in lower or "prior chat memory" in lower or "no prior chat" in lower, prompt.name
              for marker in ("Objective", "Evidence ceiling", "Required receipt", "Stop conditions", "Handoff"):
                  assert marker in text, (prompt.name, marker)
              assert any(marker in text for marker in ("Writer lease", "Writable lease", "## Authority", "## Writer lease")), prompt.name
          p6 = (prompt_dir / "P6-docs-stack-convergence.system.md").read_text(encoding="utf-8")
          assert "Profile-D v5 PR #84" in p6 and "32326260896" in p6 and "4978669357" in p6
          p7 = (prompt_dir / "P7-local-handoff-compiler.system.md").read_text(encoding="utf-8")
          assert "Root-D v3" in p7
          assert "#59, H3R #67 and H3RR #71 have `authority NONE`" in p7
          print("PASS root fresh-session prompts P0-P7=8")
          PY

      - name: Parse compile portable surface and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence.py \
            profiles/agent-thinking-inception/tests/convergence/verify_profile_convergence_mutations.py \
            profiles/agent-thinking-inception/tests/docs/verify_profile_docs.py
          python3 -m json.tool profiles/agent-thinking-inception/plans/closure-record.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/vertical-canary.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/molecular-stack-index.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/directory-state-machine-index.json >/dev/null
          python3 -m json.tool profiles/agent-thinking-inception/plans/data-flow.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path("README.md"), Path("AGENTS.md"), Path("ARCHITECTURE.md"), Path("CONTEXT.md"),
              Path("docs/INDEX.md"), Path("docs/architecture/DATA_FLOW.md"),
              Path("docs/architecture/STATE_MACHINES.md"), Path("docs/traceability/MOLECULAR_STACK_INDEX.md"),
              Path("prompts/README.md"), Path("handoff/README.md"),
          ] + sorted(Path("docs/prompts").glob("P*-*.system.md"))
          corpus = "\n".join(p.read_text(encoding="utf-8") for p in paths)
          forbidden = ["/"+"Users"+"/", "/"+"home"+"/", "/mnt/"+"data/", "BEGIN "+"PRIVATE KEY", "Authorization: Bearer "]
          assert not [x for x in forbidden if x in corpus], "NON_PORTABLE_OR_PRIVATE_ROOT_SURFACE"
          print("PASS portable/private-safe Root-D v3 documentation surface")
          PY
          git diff --check f04f9fc78270c8f97ce978e2ccc161ab4d724ca4...HEAD

      - name: Evidence ceiling receipt
        run: |
          cat <<'EOF'
          PASS EAS-DV v3 exact Root-D documentation verification
          target=6981c700f9f2f9128ebeebdf80e627178b2be336
          tree=d044ae652b65af6a0aba49f0f79c7c04c630bebf
          parent_profile_d=f04f9fc78270c8f97ce978e2ccc161ab4d724ca4
          root_doc_paths=18
          fresh_session_prompts=8
          requirements=15
          contradictions=14
          stronger_no_credit_lanes=13
          required_lanes_satisfied=1
          requirement_closure_credit=0
          EAS_A=ADVISORY_ONLY
          google_connectivity=NOT_PERFORMED
          google_write=NOT_PERFORMED
          source_correctness=NOT_PROVEN
          vertical_canary=PLAN_ONLY
          full_architecture=BLOCKED_FOR_CLOSURE
          P7=REBIND_REQUIRED
          P7_execution=NOT_PERFORMED
          Human_admission=NOT_PERFORMED
          release_rollback=NOT_PERFORMED
          EOF
